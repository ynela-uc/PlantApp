# Builds the iPhone app on a GitHub-hosted Mac (new Xcode) and saves an UNSIGNED .ipa.
#
# Why: the developer's own Mac is too old (Xcode 14.2) to install on their iPhones.
# Download the artifact "PlantApp-unsigned-ipa" from the finished run, then install it
# with a sideloading tool (for example Sideloadly) that signs it with your own Apple ID.
# Nothing secret is needed here: no certificates, no Apple ID, no keys.
#
# Run it: GitHub -> Actions -> "iOS unsigned IPA" -> Run workflow.

name: iOS unsigned IPA

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "ios/**"
      - ".github/workflows/ios-unsigned-ipa.yml"

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate the Xcode project
        working-directory: ios
        run: xcodegen generate

      - name: Build for iPhone (no code signing)
        working-directory: ios
        run: |
          xcodebuild \
            -project PlantApp.xcodeproj \
            -scheme PlantApp \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package the .ipa
        working-directory: ios
        run: |
          APP="build/Build/Products/Release-iphoneos/PlantApp.app"
          test -d "$APP"
          rm -rf Payload PlantApp-unsigned.ipa
          mkdir Payload
          cp -R "$APP" Payload/
          zip -qr PlantApp-unsigned.ipa Payload
          ls -lh PlantApp-unsigned.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: PlantApp-unsigned-ipa
          path: ios/PlantApp-unsigned.ipa
          if-no-files-found: error
          retention-days: 14
